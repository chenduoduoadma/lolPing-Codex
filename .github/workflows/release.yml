name: Build Windows release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:helper
      - run: npm run typecheck
      - run: npm exec -- vitest run --maxWorkers=2
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Publish installer and checksum
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = node -p "require('./package.json').version"
          $installer = "release/lolPing-Codex-Setup-$version.exe"
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  lolPing-Codex-Setup-$version.exe" | Set-Content release/SHA256SUMS.txt -Encoding utf8
          $existing = gh release view "v$version" --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($existing -ne 'true') { throw 'This version is already published; bump package.json before releasing again.' }
          } else {
            gh release create "v$version" --draft --title "lolPing Codex $version" --generate-notes --target $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw 'Failed to create release draft.' }
          }
          gh release upload "v$version" $installer release/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Failed to upload release assets.' }
          gh release edit "v$version" --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Failed to publish release.' }
